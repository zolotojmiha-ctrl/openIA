{% if page.has_other_pages %}<div class="actions section-gap">{% if page.has_previous %}<a class="button secondary" href="?q={{ q|urlencode }}&page={{ page.previous_page_number }}">← Назад</a>{% endif %}<span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?q={{ q|urlencode }}&page={{ page.next_page_number }}">Далее →</a>{% endif %}</div>{% endif %}
