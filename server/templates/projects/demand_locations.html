<table class="demand-location-table"><thead><tr><th>км</th><th>№ дефекта</th><th>№ секции</th><th>Нужно, {{ unit|default:'шт.' }}</th></tr></thead><tbody>{% for p in placements %}<tr><td>{% if p.job %}<a href="{% url 'repair_detail' p.job.pk %}">{{ p.kilometres }}</a>{% else %}{{ p.kilometres }}{% endif %}</td><td>{{ p.defect_numbers }}</td><td>{{ p.pipe_sections }}</td><td>{{ p.quantity|floatformat:'-3' }}</td></tr>{% endfor %}</tbody></table>
