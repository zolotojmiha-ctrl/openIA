{% extends 'accounts/base.html' %}{% block content %}<a class="back-link" href="{% url 'mail_outbox' box.pk %}">← Исходящие {{ box.address }}</a><h1>Написать письмо</h1><p>От: {{ box.address }}</p><form method="post" enctype="multipart/form-data" class="panel">{% csrf_token %}{{ form.as_p }}<label>Вложения: до 10 файлов, каждый до 10 МБ, вместе до 15 МБ<input type="file" name="files" multiple></label>{% if draft %}{% for file in draft.attachments.all %}<p>Прикреплено: {{ file.name }}</p>{% endfor %}{% endif %}<div class="actions"><button class="button" name="action" value="send">Отправить</button><button class="button secondary" name="action" value="draft">Сохранить черновик</button></div></form>{% endblock %}
