{% extends 'accounts/base.html' %}{% block content %}<section class="panel"><h1>{% if action == 'delete' %}Удалить фотографию{% else %}Изменить фотографию{% endif %}</h1><p>{{ photo.name }} · {{ photo.report.performed_date|date:'d.m.Y' }}</p><img src="{% url 'repair_attachment' photo.pk %}?preview=1" alt="{{ photo.name }}" width="240"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>Проверить перед подтверждением</button> <a href="{% url 'repair_detail' photo.report.job_id %}#repair-gallery">Отмена</a></form></section>{% endblock %}
