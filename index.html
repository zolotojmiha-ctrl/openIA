<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>АРМАДА | Управление — прототип</title><style>:root{--ink:#322a3f;--muted:#756c80;--line:#e5e0eb;--bg:#f5f4f7;--purple:#765aa1;--green:#256447;--orange:#956115}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.55 Arial,Helvetica,sans-serif;background:var(--bg)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}a{color:inherit;text-decoration:none}button:disabled{cursor:not-allowed;opacity:.5}.demo-bar{background:#eee5ce;color:#66562e;padding:9px 20px;text-align:center;font-size:11px;position:relative;z-index:2}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 35px)}.sidebar{background:var(--ink);color:white;padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:bold;letter-spacing:.04em}.brand small{display:block;font-size:10px;font-weight:normal;letter-spacing:.16em;color:#c6bbd4;margin-top:5px}.sidebar nav{display:grid;gap:6px;margin-top:42px}.sidebar nav a{padding:12px 14px;color:#d3cbdc;border-radius:6px;display:flex;gap:13px}.sidebar nav a.active,.sidebar nav a:hover{background:#50415f;color:white}.side-bottom{margin-top:auto;padding-top:55px;font-size:12px;color:#c6bbd4}.side-bottom a{display:block;margin-top:12px}.workspace{min-width:0}.topbar{padding:20px 35px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.breadcrumb{color:var(--muted);font-size:12px}.profile{display:flex;align-items:center;gap:13px}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#eee8f4;color:#674b8d;font-weight:bold}.profile small{display:block;color:var(--muted);font-size:10px}.content{max-width:1440px;margin:auto;padding:35px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:.13em;color:var(--muted);font-weight:bold}h1{font-size:32px;line-height:1.2;letter-spacing:-.035em;margin:12px 0}h2{font-size:19px;letter-spacing:-.02em;margin:0 0 17px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted)}.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.page-head p{margin-bottom:0}.button{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:5px;padding:10px 17px;display:inline-block;font-size:12px;text-align:center}.button:hover{background:#51415f}.button.secondary{background:white;color:var(--ink);border-color:#d6cedf}.button.danger{background:#fff3f1;border-color:#e6bfba;color:#983c31}.button.small{padding:6px 10px}.button.light{border-color:#796d8a;background:transparent}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:24px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:32px;font-weight:500;line-height:1.4}.stat span{font-size:11px;color:var(--muted)}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel{margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.panel-head h2{margin:0}.badge{display:inline-block;font-size:10px;font-weight:normal;border-radius:30px;padding:4px 10px;background:#eee9f5;color:#685286;white-space:nowrap}.badge.green{background:#e7f3eb;color:var(--green)}.badge.amber{background:#fff1d9;color:var(--orange)}.badge.red{background:#fbe9e6;color:#a34438}.notice{padding:14px 17px;border-left:3px solid #a88549;background:#fff4de;color:#7d5c22;font-size:12px;margin:18px 0}.notice.neutral{background:#eee9f6;color:#66547c;border-color:#927ca9}.rows{display:grid}.row{display:flex;gap:15px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:17px 0}.row p{margin:4px 0 0;font-size:12px;color:var(--muted)}.row .badge{flex-shrink:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{font-size:10px;letter-spacing:.04em;color:var(--muted);font-weight:normal;background:#faf9fc}td,th{padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:top}td a{font-weight:bold}td a:hover{text-decoration:underline}.search{width:min(100%,400px);margin-bottom:20px}.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:12px;font-weight:bold}input,select,textarea{display:block;width:100%;border:1px solid #cfc7d9;border-radius:4px;background:white;color:var(--ink);padding:11px;margin-top:7px;min-height:42px}textarea{min-height:95px;resize:vertical}.full{grid-column:1/-1}.help{font-size:11px;color:var(--muted);margin:7px 0 0}.permission{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:14px 0;font-weight:normal}.permission input{width:19px;min-height:19px;height:19px;accent-color:var(--purple);margin:0}.permissions{max-width:650px}.empty{padding:30px;text-align:center;color:var(--muted)}.document-preview{background:#f8f7fa;border:1px dashed #c9bdd8;min-height:225px;display:grid;place-content:center;text-align:center;padding:25px}.document-preview strong{display:block;font-size:19px}.document-preview .icon{font-size:45px;color:#a698b7}.document-preview p{max-width:350px;font-size:12px;color:var(--muted)}.details{display:grid;grid-template-columns:130px 1fr;gap:12px;font-size:12px}.details dt{color:var(--muted)}.details dd{margin:0}.login{max-width:1040px;min-height:75vh;margin:50px auto;display:grid;grid-template-columns:1fr 1fr;background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.login-intro{background:var(--ink);color:white;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.login-intro h1{font-size:42px}.login-intro p{color:#d1c7dc}.login-form{padding:48px}.login-form .button{width:100%;margin-top:15px}.login-form select{margin:12px 0 25px}.mobile-nav{display:none}#toast{position:fixed;bottom:25px;right:25px;max-width:420px;background:var(--ink);color:white;padding:15px 22px;border-radius:7px;box-shadow:0 8px 30px #322a3f33;z-index:10}#toast:empty{display:none}.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:20px}.timeline p{font-size:12px}.timeline small{color:var(--muted)}.welcome{padding:28px;background:linear-gradient(115deg,#eae3f3,#f2eef8);border-radius:8px}.welcome h2{font-size:25px}.welcome p{margin:0;color:#756483;font-size:12px}.object-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.object-cards .panel{transition:border-color .15s}.object-cards .panel:hover{border-color:#ac96c5}.object-cards .eyebrow{margin-bottom:20px}.object-cards h2{margin-bottom:10px}.section-gap{margin-top:25px}.role-select{max-width:210px;font-size:11px;padding:6px;margin:0;min-height:30px}.user-info{font-size:12px}.version-item{border-top:1px solid var(--line);padding:15px 0}.version-item p{font-size:12px}.version-item strong{margin-right:10px}.online{font-size:10px;color:var(--green)}@media(max-width:1100px){.sidebar{padding:25px 14px}.layout{grid-template-columns:200px minmax(0,1fr)}.content{padding:25px}.topbar{padding:18px 25px}.stats{grid-template-columns:1fr 1fr}.columns{grid-template-columns:1fr}.brand{font-size:16px}.profile .user-info{display:none}}@media(max-width:700px){.layout{display:block}.sidebar{padding:18px 20px}.sidebar .brand small{display:inline;margin-left:10px;font-size:8px}.sidebar nav{display:flex;overflow-x:auto;margin-top:18px;gap:7px}.sidebar nav a{white-space:nowrap;padding:9px 11px;font-size:12px}.side-bottom{display:none}.topbar{padding:14px 20px;flex-wrap:wrap}.content{padding:23px 17px}.page-head{align-items:flex-start;flex-direction:column;gap:15px}h1{font-size:28px}.panel,.stat{padding:18px}.stats{gap:10px}.stat strong{font-size:28px}.object-cards,.grid-form{grid-template-columns:1fr}.demo-bar{font-size:9px;padding:8px 14px}.login{margin:20px 15px;grid-template-columns:1fr}.login-intro{padding:28px}.login-intro h1{font-size:30px}.login-form{padding:28px}.login-intro>p{display:none}.row{flex-wrap:wrap}.details{grid-template-columns:100px 1fr}.badge{white-space:normal}.profile{gap:8px}.role-select{max-width:190px}#toast{left:17px;right:17px;bottom:17px}.panel-head{flex-wrap:wrap}.full{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}.panel,.row>div,td{overflow-wrap:anywhere}.panel,.grid-form>*,.columns>*{min-width:0}
</style></head><body><div class="demo-bar">ИНТЕРАКТИВНЫЙ ПРОТОТИП · Все объекты, сотрудники и документы — демонстрационные. Не вводите реальные данные.</div><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>'use strict';
const app = document.querySelector('#app');
const KEY = 'armada-prototype-v1';
const permissions = {read:'Просмотр документов',upload:'Загрузка документов',replace:'Замена файла новой версией',archive:'Архивирование',restore:'Восстановление из архива',download:'Скачивание',export:'Экспорт списка документов',personal:'Персональные документы',subcontractor:'Документы субподрядчиков'};
const seed = () => ({user:null, grants:{master:{read:true,upload:true,replace:false,archive:false,restore:false,download:false,export:false,personal:false,subcontractor:false}}, defects:[], documents:[{id:'d1',name:'Схема организации работ · ДЕМО',type:'Производственные документы',archived:false,versions:[{n:1,name:'Демонстрационный макет V1',status:'approved',author:'Руководитель · ДЕМО',date:'Демонстрационная исходная версия'},{n:2,name:'Демонстрационный макет V2',status:'pending',author:'Мастер · ДЕМО',date:'Демонстрационная новая версия'}]},{id:'d2',name:'Перечень оборудования · ДЕМО',type:'Производственные документы',archived:false,versions:[{n:1,name:'Демонстрационный макет',status:'approved',author:'Руководитель · ДЕМО',date:'Демонстрационная исходная версия'}]}],audit:[]});
let state;
try { state=JSON.parse(localStorage.getItem(KEY)); if(!state || !Array.isArray(state.documents) || !state.grants?.master) state=seed(); } catch {state=seed();}
let toastTimer;
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const manager = () => ['director','engineer'].includes(state.user);
const can = p => manager() || !!state.grants.master[p];
const userName = () => ({director:'Руководитель 1 · ДЕМО',engineer:'Руководитель 2 · ДЕМО',master:'Мастер / прораб · ДЕМО'}[state.user] || '');
const now = () => new Date().toLocaleString('ru-RU');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch{toast('Не удалось сохранить на устройстве. Данные останутся только до закрытия страницы.');return false;}}
function log(text){state.audit.unshift({text,actor:userName(),date:now()});save();}
function toast(text){document.querySelector('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',5500);}
const statusBadge = s => `<span class="badge ${s==='approved'?'green':s==='revision'?'red':'amber'}">${s==='approved'?'Утверждена':s==='revision'?'На доработке · использование запрещено':'Текущая — не утверждена'}</span>`;
const btn=(label,action,extra='',cls='')=>`<button class="button ${cls}" data-action="${action}" ${extra}>${label}</button>`;
const current=d=>d.versions[d.versions.length-1];
const docLink=d=>`<a href="#/documents/${d.id}">${esc(d.name)}</a>`;
function header(eyebrow,title,description='',action=''){return `<div class="page-head"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${description?`<p class="muted">${description}</p>`:''}</div>${action}</div>`;}
function login(){return `<div class="login"><div class="login-intro"><a class="brand" href="#">АРМАДА-СИБИРЬ<small>УПРАВЛЕНИЕ</small></a><div><span class="eyebrow" style="color:#c6bbd4">КОРПОРАТИВНАЯ ПЛАТФОРМА</span><h1>Все рабочие<br>вопросы.<br>В одном месте.</h1><p>Объекты, договоры, документы<br>и работа на трассе.</p></div><p>Интерактивный прототип · версия 0.1</p></div><div class="login-form"><h2>Знакомство с кабинетом</h2><p class="muted">Выберите, от чьего имени посмотреть систему.</p><div class="notice">Это демонстрация интерфейса. Настоящей авторизации и защиты данных пока нет. Телефон и пароль не запрашиваются.</div><form id="demo-login"><label for="demo-role">Демонстрационная роль</label><select id="demo-role" name="role"><option value="director">Руководитель 1 — полные права</option><option value="engineer">Руководитель 2 — те же полные права</option><option value="master">Мастер / прораб</option></select><button class="button" type="submit">Открыть демонстрационный кабинет →</button></form><p class="help">Начальные права мастера — только пример, не согласованная матрица. Руководитель может изменить их в разделе «Сотрудники».</p><p class="help">Реальный вход по телефону и паролю, первичная смена пароля и восстановление будут реализованы в рабочей версии.</p><a class="button secondary section-gap" href="#">Публичный сайт — в ZIP-архиве</a></div></div>`;}
const navs=[['/dashboard','◫','Главная'],['/objects','▱','Объекты'],['/contracts','▤','Договоры'],['/documents','▧','Документы'],['/defects','⌖','Дефекты'],['/approvals','✓','Утверждение'],['/users','♙','Сотрудники'],['/audit','◷','История']];
function render(){
 const route=location.hash.slice(1)||'/dashboard';
 if(!state.user){app.innerHTML=login();return;}
 const restricted=['/approvals','/users','/audit'];
 let body;
 if(restricted.some(r=>route===r)&&!manager()) body=header('ДОСТУП ОГРАНИЧЕН','Только для руководителей')+'<div class="panel">Переключитесь на демонстрационного руководителя для просмотра этого раздела.</div>';
 else if(route==='/dashboard')body=dashboard();
 else if(route==='/objects')body=objects();
 else if(route==='/objects/o1')body=objectDetail();
 else if(route==='/contracts')body=contracts();
 else if(route==='/contracts/c1')body=contractDetail();
 else if(route==='/documents')body=documents();
 else if(route.startsWith('/documents/'))body=documentDetail(route.split('/')[2]);
 else if(route==='/approvals')body=approvals();
 else if(route==='/defects/new')body=defectForm();
 else if(route.startsWith('/defects/edit/'))body=defectForm(route.split('/')[3]);
 else if(route==='/defects')body=defects();
 else if(route==='/users')body=users();
 else if(route==='/audit')body=audit();
 else body=header('НАВИГАЦИЯ','Страница не найдена')+'<a class="button" href="#/dashboard">На главную</a>';
 app.innerHTML=`<div class="layout"><aside class="sidebar"><a class="brand" href="#/dashboard">АРМАДА<small>УПРАВЛЕНИЕ / ДЕМО</small></a><nav aria-label="Разделы кабинета">${navs.filter(([r])=>manager()||!restricted.includes(r)).map(([r,i,n])=>`<a href="#${r}" class="${route===r||route.startsWith(r+'/')?'active':''}" ${route===r?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${n}</a>`).join('')}</nav><div class="side-bottom">ООО «Армада-Сибирь»<br>Все записи — учебные<a href="#">Публичный сайт — в ZIP-архиве</a><button class="button light small section-gap" data-action="reset">Сбросить демоданные</button></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">Рабочее пространство <span class="online">· ${navigator.onLine?'Браузер сообщает: сеть доступна':'Нет сети — локальная демонстрация'}</span></div><div class="profile"><span class="avatar" aria-hidden="true">${manager()?'Р':'М'}</span><div class="user-info">${userName()}<small>${manager()?'Полный доступ':'Назначенный объект · ДЕМО'}</small></div><label><span class="help">Посмотреть как</span><select class="role-select" id="switch-role" aria-label="Демонстрационная роль"><option value="director" ${state.user==='director'?'selected':''}>Руководитель 1</option><option value="engineer" ${state.user==='engineer'?'selected':''}>Руководитель 2</option><option value="master" ${state.user==='master'?'selected':''}>Мастер / прораб</option></select></label><button class="button secondary small" data-action="logout">Выйти</button></div></header><main class="content" id="main">${body}</main></div></div>`;
}
function dashboard(){const pending=state.documents.filter(d=>!d.archived&&current(d).status==='pending');return header('РАБОЧИЙ СТОЛ',manager()?'Общая картина. Под контролем.':'Мой рабочий день','Демонстрационные сведения — не данные реального омского пилота.',manager()?'':'<a class="button" href="#/defects/new">+ Записать дефект</a>')+`<div class="welcome"><h2>${manager()?'От решений — к работе.':'Работа на объекте начинается здесь.'}</h2><p>${manager()?'Проверьте новые версии, назначьте права и просмотрите изменения.':'Откройте документы, зафиксируйте дефект и добавьте координаты, когда это удобно.'}</p></div><div class="stats"><div class="stat"><small>Назначенные объекты</small><strong>1</strong><span>Учебный участок</span></div><div class="stat"><small>Договоры</small><strong>1</strong><span>Демонстрационный договор</span></div><div class="stat"><small>Документы на утверждении</small><strong>${can('read')?pending.length:'—'}</strong><span>Новые текущие версии</span></div><div class="stat"><small>Записано дефектов</small><strong>${state.defects.length}</strong><span>Сохранены в этом браузере</span></div></div><div class="columns"><section class="panel"><div class="panel-head"><h2>${manager()?'Требуют решения':'Рабочие документы'}</h2><a class="muted" href="#/documents">Все документы →</a></div>${can('read')?state.documents.filter(d=>!d.archived&&(!manager()||current(d).status==='pending')).map(d=>`<div class="row"><div>${docLink(d)}<p>Учебный участок · версия ${current(d).n}</p></div>${statusBadge(current(d).status)}</div>`).join('')||'<p class="muted">Нет документов, ожидающих решения.</p>':'<p class="muted">Просмотр документов не разрешён.</p>'}</section><section class="panel"><h2>Мой объект</h2><span class="badge green">Демонстрационный</span><h3 class="section-gap">Учебный участок трубопровода</h3><p class="muted">Не привязан к реальному договору. Все реквизиты условные.</p><a class="button secondary" href="#/objects/o1">Карточка объекта →</a><a class="button secondary section-gap" href="#/defects/new">⌖ Зафиксировать дефект</a></section></div>`;}
function objects(){return header('ОБЪЕКТЫ','Работа начинается с объекта','Пока показан один учебный объект.')+`<div class="object-cards"><a class="panel" href="#/objects/o1"><div class="eyebrow">ОБЪЕКТ DEMO-001</div><h2>Учебный участок трубопровода</h2><p class="muted">Трубопровод «Учебный» · условные сведения</p><div class="row"><span>1 договор · ${state.documents.length} документа</span><span class="badge green">ДЕМО</span></div></a></div>`;}
function objectDetail(){return header('ОБЪЕКТ / DEMO-001','Учебный участок трубопровода','Не является карточкой реального омского пилота.','<a class="button" href="#/defects/new">+ Записать дефект</a>')+`<div class="columns"><section class="panel"><h2>Сведения об объекте</h2><dl class="details"><dt>Юридическое лицо</dt><dd>ООО «Армада-Сибирь»</dd><dt>Трубопровод</dt><dd>«Учебный» · ДЕМО</dd><dt>Ответственный</dt><dd>Мастер / прораб · ДЕМО</dd><dt>Договор</dt><dd><a href="#/contracts/c1">ДЕМО-001 →</a></dd></dl><div class="notice neutral">Реальные участки и договорные связи появятся после сверки подписанных первоисточников.</div></section><section class="panel"><h2>Документы объекта</h2>${can('read')?state.documents.filter(d=>!d.archived).map(d=>`<div class="row">${docLink(d)}${statusBadge(current(d).status)}</div>`).join(''):'Доступ не назначен'}</section></div>`;}
function contracts(){return header('ДОГОВОРЫ','Договоры и связи','Доступ к одному объекту не открывает все условия договора.')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Номер</th><th>Предмет</th><th>Объект</th><th>Доступ</th></tr></thead><tbody><tr><td><a href="#/contracts/c1">ДЕМО-001</a></td><td>Учебный договор · без юридической силы</td><td>Учебный участок</td><td><span class="badge">${manager()?'Полный':'Ограниченный'}</span></td></tr></tbody></table></div></div>`;}
function contractDetail(){return header('ДОГОВОР / ДЕМО-001','Учебный договор','Не подписанный документ. Номер, условия и связи — демонстрационные.')+`<div class="columns"><section class="panel"><h2>Карточка договора</h2><dl class="details"><dt>Номер</dt><dd>ДЕМО-001</dd><dt>Предмет</dt><dd>Учебный пример организации работ</dd><dt>Объекты</dt><dd><a href="#/objects/o1">Учебный участок →</a></dd>${manager()?'<dt>Цена и условия</dt><dd>Реальные суммы не предоставлены</dd>':''}</dl>${!manager()?'<div class="notice">Показана ограниченная карточка. Финансовые условия и полный оригинал не предоставлены этой роли.</div>':''}</section><section class="panel"><h2>Доступные документы</h2>${can('read')?state.documents.filter(d=>!d.archived).map(d=>`<div class="row">${docLink(d)}</div>`).join(''):'Просмотр не разрешён'}</section></div>`;}
function documents(){return header('ДОКУМЕНТЫ','Нужное — под рукой','Файлы не отправляются на сервер. Демонстрируются карточки и версии.',can('upload')?btn('+ Добавить документ','new-document'):'')+(!can('read')?'<div class="panel">Руководитель пока не предоставил право просмотра документов.</div>':`<div class="panel"><label>Поиск по названию<input class="search" id="document-search" type="search" placeholder="Например, схема"></label><div class="table-wrap"><table><thead><tr><th>Документ</th><th>Раздел</th><th>Версия</th><th>Состояние</th><th>Хранение</th></tr></thead><tbody>${state.documents.map(d=>`<tr data-search="${esc(d.name.toLowerCase())}"><td>${docLink(d)}</td><td>${esc(d.type)}</td><td>V${current(d).n}</td><td>${statusBadge(current(d).status)}</td><td>${d.archived?'Архив':'Активный'}</td></tr>`).join('')}</tbody></table></div><p id="search-empty" class="empty" hidden>Документы не найдены.</p>${can('export')?btn('Экспортировать демосписок CSV','export-documents','','secondary section-gap'):''}</div>`);}
function documentDetail(id){const d=state.documents.find(x=>x.id===id);if(!d||!can('read'))return header('ДОКУМЕНТ','Документ недоступен');const v=current(d);return header('ДОКУМЕНТ / '+esc(d.id),esc(d.name),'Учебный участок → ДЕМО-001',statusBadge(v.status))+`${d.archived?'<div class="notice">Карточка находится в архиве.</div>':''}${v.status==='revision'?'<div class="notice">Отправлен на доработку. Использование этой версии запрещено. Исправление загружается новой версией и снова требует утверждения.</div>':v.status==='pending'?'<div class="notice">Эту версию можно использовать, но она ещё не утверждена руководителем.</div>':''}<div class="columns"><section class="panel"><div class="document-preview"><span class="icon" aria-hidden="true">▧</span><strong>Демонстрационный макет · V${v.n}</strong><p>Здесь будет защищённый просмотр файла. Реальный документ в прототип не загружен.</p></div><div class="actions section-gap">${!d.archived&&can('replace')?btn('Загрузить исправленную версию','replace',`data-id="${d.id}"`):''}${!d.archived&&can('download')?btn('Скачать демомакет','download',`data-id="${d.id}" ${v.status==='revision'?'disabled':''}`,'secondary'):''}${!d.archived&&can('archive')?btn('В архив','archive',`data-id="${d.id}"`,'secondary'):''}${d.archived&&can('restore')?btn('Восстановить','restore',`data-id="${d.id}"`,'secondary'):''}</div>${manager()&&!d.archived&&v.status==='pending'?`<div class="notice neutral">Решение относится только к версии V${v.n}. Оба руководителя имеют одинаковые полномочия.</div><div class="actions">${btn('Утвердить','approve',`data-id="${d.id}"`)}${btn('На доработку','revision',`data-id="${d.id}"`,'danger')}</div>`:''}<input id="version-file" type="file" accept=".pdf,.docx,.xlsx,.txt" hidden><div class="help section-gap">Выбор файла сохраняет только его имя. Содержимое не читается и не отправляется.</div></section><section class="panel"><h2>История версий</h2>${[...d.versions].reverse().map(x=>`<div class="version-item"><strong>V${x.n}${x===v?' · текущая':''}</strong>${statusBadge(x.status)}<p>${esc(x.name)}<br><span class="muted">${esc(x.author)} · ${esc(x.date)}</span></p>${x.reason?`<p>Причина доработки: ${esc(x.reason)}</p>`:''}${x.decision?`<p class="help">Решение: ${esc(x.decision)}</p>`:''}</div>`).join('')}<h3 class="section-gap">Связи</h3><p><a href="#/objects/o1">Учебный участок →</a></p><p><a href="#/contracts/c1">ДЕМО-001 →</a></p></section></div>`;}
function approvals(){return header('РУКОВОДИТЕЛЮ','Документы на утверждение','Любой из двух руководителей может принять решение самостоятельно.')+`<div class="panel">${state.documents.filter(d=>!d.archived&&current(d).status==='pending').map(d=>`<div class="row"><div>${docLink(d)}<p>Текущая версия V${current(d).n}</p></div><a class="button secondary" href="#/documents/${d.id}">Проверить →</a></div>`).join('')||'<div class="empty">Все новые версии рассмотрены.</div>'}</div>`;}
function defects(){return header('РАБОТА НА ТРАССЕ','Журнал дефектов','Записи сохраняются только в этом браузере. Общей базы и синхронизации пока нет.','<a class="button" href="#/defects/new">+ Записать дефект</a>')+`<div class="notice neutral">Офлайн-сценарий — прототип. Установки приложения, защищённого входа без сети и автоматической отправки пока нет. Открытая страница позволяет сохранить учебную запись локально.</div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Дефект</th><th>Трасса / км</th><th>Секция</th><th>Координаты</th><th>Хранение</th><th></th></tr></thead><tbody>${state.defects.map(d=>`<tr><td>${esc(d.number)}</td><td>«Учебный» / ${esc(d.km)}</td><td>${esc(d.section)}</td><td>${d.lat!==''?`${esc(d.lat)}, ${esc(d.lon)}`:'<span class="badge amber">Координаты не указаны</span>'}</td><td><span class="badge">Только на устройстве</span></td><td><a href="#/defects/edit/${d.id}">Открыть →</a></td></tr>`).join('')}</tbody></table></div>${!state.defects.length?'<div class="empty">Пока нет записей. Добавьте первый учебный дефект.</div>':''}</div>`;}
function defectForm(id){const d=state.defects.find(d=>d.id===id)||{km:'',section:'',number:'',lat:'',lon:'',comment:'',accuracy:'',source:'',photo:''};if(id&&!state.defects.some(d=>d.id===id))return header('ДЕФЕКТ','Запись не найдена');return header('ЖУРНАЛ ДЕФЕКТОВ',id?'Дополнить запись':'Зафиксировать дефект','Координаты можно добавить сейчас или позже.','<a class="button secondary" href="#/defects">← К журналу</a>')+`<section class="panel"><form id="defect-form" data-id="${id||''}"><div class="grid-form"><label>Объект<select name="object" required><option value="o1">Учебный участок · ДЕМО</option></select></label><label>Трубопровод<select name="pipeline" required><option value="p1">«Учебный» · ДЕМО</option></select></label><label>Километр трассы *<input name="km" required inputmode="decimal" maxlength="30" value="${esc(d.km)}" placeholder="Например, 125,4"></label><label>№ секции *<input name="section" required maxlength="80" value="${esc(d.section)}"></label><label>№ дефекта *<input name="number" required maxlength="80" value="${esc(d.number)}"></label><div><h3>Координаты — необязательно</h3>${btn('⌖ Определить местоположение','locate','','secondary')}<p class="help" id="geo-status" role="status">${d.source?esc(d.source):'Снимайте местоположение непосредственно у дефекта.'}</p></div><label>Широта (−90…90)<input name="lat" type="number" step="any" min="-90" max="90" value="${esc(d.lat)}" placeholder="Можно заполнить позже"></label><label>Долгота (−180…180)<input name="lon" type="number" step="any" min="-180" max="180" value="${esc(d.lon)}" placeholder="Можно заполнить позже"></label><input name="accuracy" type="hidden" value="${esc(d.accuracy)}"><input name="source" type="hidden" value="${esc(d.source)}"><input name="capturedAt" type="hidden" value="${esc(d.capturedAt||'')}"><label>Фото — необязательно<input name="photo" type="file" accept="image/*" capture="environment"><span class="help">В прототипе сохраняется только имя: ${esc(d.photo||'фото не выбрано')}. Само фото не сохраняется.</span></label><label>Комментарий<textarea name="comment" maxlength="3000">${esc(d.comment)}</textarea></label></div><div class="notice">Сохранение — только на этом устройстве. Не вводите настоящие производственные сведения. При очистке браузера демозаписи удалятся.</div><p class="help" id="defect-error" role="alert"></p><button type="submit" class="button">Сохранить учебную запись</button></form></section>`;}
function users(){return header('УПРАВЛЕНИЕ ДОСТУПОМ','Сотрудники и права','Оба руководителя могут назначать и отзывать права. Настройки ниже — учебный пример.')+`<div class="columns"><section class="panel"><h2>Участники демонстрации</h2><div class="row"><div>Руководитель 1 · ДЕМО<p>Полные права</p></div><span class="badge green">Администратор</span></div><div class="row"><div>Руководитель 2 · ДЕМО<p>Точно такие же полные права</p></div><span class="badge green">Администратор</span></div><div class="row"><div>Мастер / прораб · ДЕМО<p>Назначен на учебный участок</p></div><span class="badge">Сотрудник</span></div><div class="notice neutral">Создание настоящих учётных записей и выдача паролей в прототипе недоступны.</div></section><section class="panel permissions"><h2>Права мастера / прораба</h2><p class="help">Раздел: производственные документы. Объект: учебный участок. Выбор персональных и внешних документов будет детализирован в рабочей версии.</p><form id="permissions-form">${Object.entries(permissions).map(([key,label])=>`<label class="permission">${label}<input type="checkbox" name="${key}" ${state.grants.master[key]?'checked':''}></label>`).join('')}<button class="button section-gap" type="submit">Сохранить права</button></form><p class="help">Утверждение и назначение прав остаются только у двух руководителей. Интерфейс прототипа не заменяет серверную защиту.</p></section></div>`;}
function audit(){return header('ИСТОРИЯ','Действия в прототипе','Локальный учебный журнал. Не является защищённым аудитом рабочей системы.')+`<div class="panel timeline">${state.audit.map(e=>`<p><strong>${esc(e.text)}</strong><br><small>${esc(e.actor)} · ${esc(e.date)}</small></p>`).join('')||'<p class="muted">Действия появятся после изменения документов, прав или записей дефектов.</p>'}</div>`;}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='demo-login'){state.user=new FormData(f).get('role');save();location.hash='/dashboard';render();}
 if(f.id==='permissions-form'&&manager()){const data=new FormData(f);for(const key of Object.keys(permissions))state.grants.master[key]=data.has(key);log('Изменены демонстрационные права мастера');toast('Права сохранены. Переключитесь на мастера, чтобы проверить результат.');render();}
 if(f.id==='defect-form'){const data=new FormData(f);const lat=data.get('lat'),lon=data.get('lon');if((lat==='')!==(lon==='')){document.querySelector('#defect-error').textContent='Укажите и широту, и долготу либо оставьте оба поля пустыми.';return;}const old=state.defects.find(d=>d.id===f.dataset.id);const d={id:old?.id||crypto.randomUUID(),km:data.get('km').trim(),section:data.get('section').trim(),number:data.get('number').trim(),lat,lon,comment:data.get('comment').trim(),source:lat===''?'':data.get('source')||'Внесены вручную',accuracy:lat===''?'':data.get('accuracy'),capturedAt:lat===''?'':data.get('capturedAt'),photo:data.get('photo')?.name||old?.photo||'',updated:now()};if(!d.km||!d.section||!d.number){document.querySelector('#defect-error').textContent='Заполните километр, номер секции и номер дефекта.';return;}if(old)state.defects[state.defects.indexOf(old)]=d;else state.defects.unshift(d);log('Сохранена учебная запись дефекта '+d.number);location.hash='/defects';render();toast('Запись сохранена локально. Серверной отправки нет.');}
});
app.addEventListener('change',e=>{if(e.target.id==='switch-role'){state.user=e.target.value;save();render();}if(e.target.name==='lat'||e.target.name==='lon'){const f=e.target.form;f.elements.source.value='Внесены вручную';f.elements.accuracy.value='';f.elements.capturedAt.value='';}});
app.addEventListener('input',e=>{if(e.target.id==='document-search'){const q=e.target.value.toLowerCase();const rows=[...app.querySelectorAll('[data-search]')];rows.forEach(r=>r.hidden=!r.dataset.search.includes(q));document.querySelector('#search-empty').hidden=rows.some(r=>!r.hidden);}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;const d=state.documents.find(x=>x.id===b.dataset.id);
 if(action==='logout'){state.user=null;save();render();}
 if(action==='reset'&&confirm('Удалить все учебные записи и вернуть исходный прототип?')){state=seed();save();location.hash='/dashboard';render();}
 if(action==='new-document'&&can('upload')){const name=prompt('Название учебного документа (не вводите реальные данные):');if(!name?.trim())return;const id=crypto.randomUUID();state.documents.push({id,name:name.trim().slice(0,150)+' · ДЕМО',type:'Производственные документы',archived:false,versions:[{n:1,name:'Демонстрационный макет',author:userName(),date:now(),status:'pending'}]});log('Добавлена карточка учебного документа');location.hash='/documents/'+id;render();}
 if(action==='replace'&&d&&can('replace')&&!d.archived){const input=document.querySelector('#version-file');input.onchange=()=>{const file=input.files[0];if(!file)return;if(file.size>10*1024*1024){toast('Для демонстрации выберите файл до 10 МБ.');return;}if(!/\.(pdf|docx|xlsx|txt)$/i.test(file.name)){toast('Для демонстрации подходят PDF, DOCX, XLSX или TXT.');return;}d.versions.push({n:current(d).n+1,name:file.name,author:userName(),date:now(),status:'pending'});log('Новая текущая версия: '+d.name);render();toast('Новая версия текущая, но не утверждена. Содержимое файла не загружалось.');};input.click();}
 if(['approve','revision'].includes(action)&&manager()&&d&&!d.archived&&current(d).status==='pending'){let reason='';if(action==='revision'){reason=prompt('Что нужно доработать?');if(!reason?.trim())return;}current(d).status=action==='approve'?'approved':'revision';current(d).reason=reason.trim();current(d).decision=userName()+' · '+now();log((action==='approve'?'Утверждена версия: ':'Направлено на доработку: ')+d.name);render();}
 if(['archive','restore'].includes(action)&&d&&can(action)){d.archived=action==='archive';log((d.archived?'Архивирован: ':'Восстановлен: ')+d.name);render();}
 if(action==='download'&&d&&can('download')&&!d.archived&&current(d).status!=='revision'){download('ДЕМОНСТРАЦИЯ.txt','ДЕМОНСТРАЦИОННЫЙ МАКЕТ. НЕ РЕАЛЬНЫЙ ДОКУМЕНТ.\n'+d.name+'\nВерсия '+current(d).n+'\n'+(current(d).status==='approved'?'Утверждена в прототипе':'НЕ УТВЕРЖДЕНА'));log('Скачан демонстрационный макет');toast('Скачан учебный текстовый макет.');}
 if(action==='export-documents'&&can('export')){const cell=s=>'"'+String(s).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';download('ДЕМО-документы.csv','\uFEFF'+['Название;Версия;Статус',...state.documents.map(d=>[d.name,current(d).n,current(d).status].map(cell).join(';'))].join('\n'),'text/csv;charset=utf-8');log('Экспортирован учебный список документов');}
 if(action==='locate'){const f=document.querySelector('#defect-form'),status=document.querySelector('#geo-status');if(!navigator.geolocation){status.textContent='Определение координат недоступно. Введите их вручную или сохраните запись без них.';return;}status.textContent='Определяем местоположение… Разрешите доступ в браузере.';b.disabled=true;navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;if(!f.isConnected)return;f.elements.lat.value=p.coords.latitude;f.elements.lon.value=p.coords.longitude;f.elements.accuracy.value=p.coords.accuracy;f.elements.source.value='Сняты на устройстве';f.elements.capturedAt.value=new Date(p.timestamp).toISOString();status.textContent='Координаты получены. Точность около '+Math.round(p.coords.accuracy)+' м. Нажмите «Сохранить».';},()=>{b.disabled=false;if(f.isConnected)status.textContent='Не удалось определить координаты. Введите их вручную или сохраните без координат.';},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('online',()=>toast('Сеть появилась. Автоматическая синхронизация в прототипе не реализована.'));
window.addEventListener('offline',()=>toast('Сеть недоступна. Открытая страница сохраняет учебные записи только в браузере.'));
render();
</script></body></html>
