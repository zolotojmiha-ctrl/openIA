# Local test only. No existing Synology folders or Docker socket are mounted.
services:
  init:
    image: armada-test-web:complete-v6.20.1
    build:
      context: .
      dockerfile: deploy/synology/Dockerfile
    user: "0:0"
    command: ["python", "/app/deploy/synology/init_secrets.py"]
    restart: "no"
    network_mode: none
    read_only: true
    mem_limit: 128m
    volumes:
      - config:/run/armada
      - documents:/var/lib/armada-documents
    security_opt:
      - no-new-privileges:true
  db:
    image: armada-test-db:local
    build:
      context: .
      dockerfile: deploy/synology/Dockerfile.postgres
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: armada_admin
      POSTGRES_DB: armada
      POSTGRES_PASSWORD_FILE: /run/armada/postgres-admin-password
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=25"]
    volumes:
      - database:/var/lib/postgresql/data
      - config:/run/armada:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armada_admin -d armada"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
  web:
    image: armada-test-web:complete-v6.20.1
    build:
      context: .
      dockerfile: deploy/synology/Dockerfile
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      PRIVATE_DOCUMENT_ROOT: /var/lib/armada-documents
      ARMADA_LAN_TEST: "1"
      ARMADA_SECRET_KEY_FILE: /run/armada/django-key
      ARMADA_MAIL_KEY_FILE: /run/armada/mail-key
      DATABASE_URL_FILE: /run/armada/database-url
      ARMADA_ALLOWED_HOSTS: "${NAS_IP:-192.168.50.248},127.0.0.1"
    ports:
      - "${NAS_IP:-192.168.50.248}:18080:8000"
    volumes:
      - config:/run/armada:ro
      - documents:/var/lib/armada-documents
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
    networks:
      - private
      - entry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/cabinet/login/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mailworker:
    image: armada-test-web:complete-v6.20.1
    restart: unless-stopped
    command: [python, server/manage.py, process_mail, --loop]
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m,mode=1777
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    environment:
      PRIVATE_DOCUMENT_ROOT: /var/lib/armada-documents
      ARMADA_LAN_TEST: "1"
      ARMADA_SECRET_KEY_FILE: /run/armada/django-key
      ARMADA_MAIL_KEY_FILE: /run/armada/mail-key
      DATABASE_URL_FILE: /run/armada/database-url
      ARMADA_ALLOWED_HOSTS: "${NAS_IP:-192.168.50.248},127.0.0.1"
    volumes:
      - config:/run/armada:ro
    networks: [private, mail_egress]
    depends_on:
      web:
        condition: service_started

volumes:
  documents:
  config:
  database:
networks:
  mail_egress:
  private:
    internal: true
  entry: {}
