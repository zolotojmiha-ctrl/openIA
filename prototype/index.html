<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АРМАДА — прототип</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243b;font:14px system-ui}button,input,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #cbd2e1;background:white;color:#26324b;border-radius:7px;padding:9px 12px}button:hover{border-color:#6545cb}button.primary{background:#6240cd;color:white;border-color:#6240cd}button.danger{color:#a32a32}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#142641;color:white;padding:22px 12px;overflow:auto}aside h2{margin:0 12px 24px}nav button{display:block;width:100%;text-align:left;background:none;color:#dee5f3;border:0;margin:4px 0;padding:12px}nav button.active{background:#6545cb}main{margin-left:220px;padding:24px;max-width:1600px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}.demo{background:#fff0c5;padding:10px 16px;border-radius:6px;margin-bottom:16px}.panel{background:white;border:1px solid #dce1eb;border-radius:10px;padding:18px;margin:14px 0}h1{font-size:25px;margin:14px 0}h2{font-size:18px}small,.muted{color:#65728a}.actions,.tabs,.metrics{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.metrics>button{min-width:150px;text-align:left;padding:16px}.metrics strong{display:block;font-size:25px}.tabs button.active{color:#6240cd;border-color:#6240cd;background:#f0ebff}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#edf1f7;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid #dce1eb}td button{padding:6px 9px;font-size:12px}tr.resolved,.resolved{background:#e1f2e8}tr.blocked,.blocked{background:#fbe1e4}tr.materials,.materials{background:#fff0c4}.badge{padding:4px 8px;border-radius:5px;font-size:12px;display:inline-block}.cards{display:none}.card{border:1px solid #dce1eb;padding:12px;border-radius:8px;margin:8px 0}.card p{margin:7px 0}label{display:block;margin:14px 0}input:not([type=checkbox]),select,textarea{padding:10px;border:1px solid #ccd3df;border-radius:6px;max-width:100%;width:100%;font:inherit}dialog{border:0;border-radius:12px;padding:24px;width:540px;max-width:95vw;box-shadow:0 12px 80px #0004}dialog::backdrop{background:#14264188}.notice{background:#fff0c4;padding:15px;border:1px solid #d6a64a;border-radius:7px}#toast{position:fixed;bottom:18px;right:18px;background:#142641;color:white;padding:14px;border-radius:8px;display:none;z-index:5}.mobile-menu{display:none}a{color:#6240cd}.pageback{margin-bottom:10px}.caption{font-size:12px;margin-top:20px;color:#65728a}
@media(max-width:760px){aside{display:none;z-index:4;width:250px}aside.open{display:block}main{margin:0;padding:14px}header{flex-wrap:wrap}.mobile-menu{display:inline-block}.desktop-defects{display:none}.cards{display:block}.metrics>button{min-width:0;flex:1;padding:12px}h1{font-size:22px}.panel{padding:12px}header .muted{display:none}}
</style><aside><h2>АРМАДА</h2><nav id="nav"></nav></aside><main><header><button class="mobile-menu" onclick="document.querySelector('aside').classList.toggle('open')">☰ Меню</button><span>Корпоративный кабинет · Прототип</span><select id="role" style="width:auto" onchange="go('home')"><option>Руководитель</option><option>Мастер</option><option>Техник</option><option>Механик</option><option>Инженер по ОТ и ПБ</option></select></header><div class="demo">Демонстрационный прототип. Только пример данных. Ничего не отправляется на NAS. При обновлении страницы изменения сбрасываются.</div><div id="screen"></div><p class="caption">Макет для проверки переходов и действий. Права доступа и сохранение на сервере здесь не реализованы.</p></main><dialog id="dialog"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const menus=[['home','Главная'],['contracts','Контракты и работы'],['objects','Объекты'],['people','Персонал'],['equipment','Техника'],['stock','Склады'],['subs','Субподрядчики'],['docs','Документы'],['finance','Финансы']];
const contracts=[['№ТЗС-1726-2025','Устранение дефектов','5 участков'],['Замена УЗА','Замена арматуры','НПС Татарская'],['Подготовка к диагностике','Подготовительные работы','НПС Татарская']];
let jobs=[{id:1,km:'153.546',n:'1748',s:'130001',m:'П2',l:'1',w:8,state:'planned',reason:''},{id:2,km:'164.202',n:'1341',s:'144580',m:'П2',l:'1,5',w:8,state:'blocked',reason:'Болото'},{id:3,km:'173.776',n:'439',s:'151700',m:'П2',l:'1',w:8,state:'materials',reason:'Нет муфты'},{id:4,km:'174.518',n:'200258',s:'152290',m:'П2',l:'1',w:8,state:'reported',reason:'',coords:'55.012345, 73.123456'}];
let current='home',ci=0,selected=new Set(),onlyReview=false,filter='';let documents=['Удостоверение','Протокол проверки знаний','Медицинское заключение'];let equipmentPlace='Омск–Татарск',balance=12,stockLog=[],team='Бригада №1';
const btn=(text,code,cls='')=>`<button class="${cls}" onclick="${code}">${text}</button>`;
const heading=(title,subtitle='')=>`<h1>${title}</h1><p class="muted">${subtitle}</p>`;
const back=(page,text)=>`<div class="pageback">${btn('← '+text,`go('${page}')`)}</div>`;
const table=(headers,rows)=>`<div class="table"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
function go(page){current=page;document.querySelector('aside').classList.remove('open');render();window.scrollTo(0,0)}
function modal(title,body,action){$('#dialog').innerHTML=`<h2>${title}</h2>${body}<div class="actions">${btn('Отмена',"$('#dialog').close()")}${action||''}</div>`;$('#dialog').showModal()}
function tabs(){return `<div class="tabs">${[['contract','Обзор'],['sections','Работы'],['brigades','Бригады'],['equipment','Техника'],['stock','Материалы'],['subs','Субподрядчики'],['docs','Документы'],['finance','Финансы']].map(([p,t])=>btn(t,`go('${p}')`,current===p?'active':'')).join('')}</div>`}
function review(){onlyReview=true;selected.clear();ci=0;go('defects')}
function openContract(i){ci=i;go('contract')}
function tone(j){return ['reported','confirmed'].includes(j.state)?'resolved':j.state}
function status(j){return j.state==='reported'?'Устранён · На проверке':j.state==='confirmed'?'Устранён · Проверен':'Не устранён'+(j.reason?' · '+j.reason:' · Ещё не выполняли')}
function action(j){return $('#role').value==='Мастер'?btn('Внести результат',`report(${j.id})`,'primary'):(j.state==='reported'?btn('Посмотреть',`detail(${j.id})`)+ ' '+btn('Подтвердить',`confirmJobs([${j.id}])`,'primary'):btn('Открыть',`detail(${j.id})`))}
function picked(id,on){on?selected.add(id):selected.delete(id);render()}
function confirmJobs(ids){let chosen=jobs.filter(j=>ids.includes(j.id)&&j.state==='reported');if(!chosen.length)return toast('Выберите результаты на проверке');modal('Подтвердить устранение',`<p>Работ: ${chosen.length}. Подтвердить результаты проверки?</p>`,btn('Подтвердить',`accept(${JSON.stringify(chosen.map(j=>j.id))})`,'primary'))}
function accept(ids){jobs.forEach(j=>{if(ids.includes(j.id)&&j.state==='reported')j.state='confirmed'});selected.clear();$('#dialog').close();render();toast('Результат подтверждён — в прототипе')}
function detail(id){let j=jobs.find(j=>j.id===id);modal(`Км ${j.km} · №${j.n}`,`<p>Секция ${j.s} · ${j.m} · ${j.l} м · ${j.w} мм</p><p>${status(j)}</p><p>Координаты: ${esc(j.coords||'Не указаны')}</p><p>Фото: демонстрационный результат без вложений</p><p>Автор: Мастер · история сохраняется в рабочей версии</p>`,j.state==='reported'&&$('#role').value!=='Мастер'?btn('Подтвердить',`accept([${id}])`,'primary')+btn('Вернуть на доработку',`returnJob(${id})`)+btn('Исправить и принять',`editAccept(${id})`):'')}
function returnJob(id){modal('Вернуть на доработку','<label>Пояснение<textarea id="note" required></textarea></label>',btn('Вернуть',`saveReturn(${id})`,'primary'))}
function saveReturn(id){let note=$('#note').value.trim();if(!note)return toast('Укажите пояснение');let j=jobs.find(j=>j.id===id);j.state='planned';j.reason='Возвращён: '+note;$('#dialog').close();render()}
function editAccept(id){let j=jobs.find(j=>j.id===id);modal('Исправить и принять',`<label>Координаты<input id="coords" value="${esc(j.coords||'')}"></label><label>Причина правки<textarea id="note"></textarea></label>`,btn('Сохранить и принять',`saveEdit(${id})`,'primary'))}
function saveEdit(id){if(!$('#note').value.trim())return toast('Укажите причину правки');jobs.find(j=>j.id===id).coords=$('#coords').value;accept([id])}
function report(id){modal('Внести результат',`<label>Результат<select id="result" onchange="$('#reasonbox').hidden=this.value==='reported';$('#coordsbox').hidden=this.value!=='reported'"><option value="reported">Устранён</option><option value="unrepaired">Не устранён</option></select></label><label id="coordsbox">Координаты одной строкой<input id="coords" placeholder="55.012345, 73.123456"></label><label id="reasonbox" hidden>Причина<select id="reason"><option>Болото</option><option>Нет проезда</option><option>Доступ только зимой</option><option>Нет муфты</option><option>Нет другого материала</option><option>Нет увеличенной П1 поверх П2</option><option>Ранее установлена муфта</option><option>Другая причина</option></select></label><label>Пояснение<textarea id="note"></textarea></label><p class="muted">Фото — по желанию. Загрузка файлов будет в рабочей версии.</p>`,btn('Отправить результат',`saveReport(${id})`,'primary'))}
function saveReport(id){let j=jobs.find(j=>j.id===id);if($('#result').value==='reported'){let c=$('#coords').value.trim();if(!/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(c))return toast('Введите широту и долготу через запятую');j.coords=c;j.state='reported';j.reason=''}else{j.reason=$('#reason').value;j.state=/Нет .*материал|Нет муфты|Нет увеличенной/.test(j.reason)?'materials':/Болото|проезда|зимой/.test(j.reason)?'blocked':'planned'}$('#dialog').close();render();toast('Результат сохранён только в прототипе')}
function renderDefects(){let list=jobs.filter(j=>(!onlyReview||j.state==='reported')&&(!filter||[j.km,j.n,j.s].some(v=>v.includes(filter))));let leader=$('#role').value!=='Мастер';return back('sections','Участки')+heading('Омск–Татарск',contracts[0][0]+' · Дефекты')+`<div class="actions">${btn('Все',"onlyReview=false;render()")}${btn('На проверке',"onlyReview=true;render()")}${btn('Скачать Excel',"toast('Экспорт будет подключён в рабочей версии')")}</div><input aria-label="Поиск дефекта" placeholder="Км, номер дефекта или секции" value="${esc(filter)}" onchange="filter=this.value;render()">`+(leader?`<div class="actions"><label><input type="checkbox" onchange="selected.clear();if(this.checked)jobs.filter(j=>(!onlyReview||j.state==='reported')&&(!filter||[j.km,j.n,j.s].some(v=>v.includes(filter)))&&j.state==='reported').forEach(j=>selected.add(j.id));render()"> Выбрать все на проверке по фильтру</label><span>Выбрано: ${selected.size}</span>${btn('Подтвердить выбранные',"confirmJobs([...selected])",'primary')}</div>`:'')+`<div class="panel desktop-defects"><table><thead><tr>${['','Км','№ дефекта','№ секции','Метод','Длина','Стенка','Состояние','Действия'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${list.map(j=>`<tr class="${tone(j)}"><td>${leader&&j.state==='reported'?`<input aria-label="Выбрать дефект ${j.n}" type="checkbox" ${selected.has(j.id)?'checked':''} onchange="picked(${j.id},this.checked)">`:''}</td><td><b>${j.km}</b></td><td>${j.n}</td><td>${j.s}</td><td>${j.m}</td><td>${j.l} м</td><td>${j.w} мм</td><td>${esc(status(j))}</td><td>${action(j)}</td></tr>`).join('')}</tbody></table></div><div class="cards">${list.map(j=>`<article class="card ${tone(j)}"><b>${leader&&j.state==='reported'?`<input aria-label="Выбрать дефект ${j.n}" type="checkbox" ${selected.has(j.id)?'checked':''} onchange="picked(${j.id},this.checked)"> `:''}Км ${j.km} · №${j.n}</b><p>Секция ${j.s} · ${j.m} · ${j.l} м · ${j.w} мм</p><p>${esc(status(j))}</p><div class="actions">${action(j)}</div></article>`).join('')}</div>`+(!list.length?'<p>Нет работ по выбранному фильтру.</p>':'')}
function render(){let count=jobs.filter(j=>j.state==='reported').length;$('#nav').innerHTML=menus.map(([p,t])=>btn(t,`go('${p}')`,current===p?'active':'')).join('');let out='';switch(current){
case 'home':{let role=$('#role').value;out=heading('Главная · '+role);if(role==='Руководитель')out+=`<div class="notice">На проверку устранения: ${count} ${btn('Открыть очередь','review()','primary')}</div><div class="metrics">${btn('Контрактов в работе <strong>3</strong>',"go('contracts')")}${btn('Есть препятствия <strong>2</strong>',"onlyReview=false;go('defects')")}</div>`+btn('Запросы на закрытие контрактов · 1',"closeContract()")+heading('Контракты')+contractTable();else if(role==='Мастер')out+=btn('Открыть задания моей бригады',"onlyReview=false;go('defects')",'primary');else if(role==='Техник')out+=heading('Ведомости и назначения')+`<div class="actions">${btn('Загрузить ведомость',"toast('Импорт будет подключён в рабочей версии')",'primary')}${btn('Назначить бригаду',"go('brigades')")}${btn('Подготовить закрытие контракта',"closeContract()")}</div>`+contractTable();else if(role==='Механик')out+=equipment();else out+=docs(true);break}
case 'contracts':out=heading('Контракты и работы')+btn('Добавить контракт','newContract()','primary')+contractTable();break;
case 'contract':out=back('contracts','Контракты')+heading(contracts[ci][0],contracts[ci][1])+tabs()+`<div class="metrics">${btn('На проверке <strong>'+count+'</strong>','review()')}${btn('Места выполнения <strong>'+contracts[ci][2]+'</strong>',"go('sections')")}</div>`+btn('Открыть работы',"go('sections')",'primary');break;
case 'sections':out=back('contract','Контракт')+heading('Места выполнения',contracts[ci][0])+tabs()+(ci===0?table(['Участок','Действие'],['Омск–Татарск','Татарск–Барабинск','Барабинск–Чулым','Чулым–Сокур','Сокур–Анжерская'].map((s,i)=>[s,btn('Открыть',i===0?"onlyReview=false;filter='';go('defects')":"toast('В этом примере заполнен участок Омск–Татарск')")])):table(['Место','Работа','Состояние'],[['НПС Татарская',contracts[ci][1],btn('Открыть этапы',"go('stages')")]]));break;
case 'stages':out=back('sections','Места выполнения')+heading(contracts[ci][1],'НПС Татарская')+table(['Этап','Состояние'],[['Подготовка площадки','Выполнено'],[ci===1?'Демонтаж арматуры':'Подготовка оборудования','В работе'],[ci===1?'Монтаж и испытания':'Передача к диагностике','Не начат']]);break;
case 'defects':out=renderDefects();break;
case 'objects':out=heading('Объекты')+table(['Место выполнения','Связанные контракты'],[['Линейная часть · Омское РНУ',btn('№ТЗС-1726-2025','openContract(0)')],['НПС Татарская',btn('Замена УЗА','openContract(1)')+' '+btn('Подготовка к диагностике','openContract(2)')]]);break;
case 'brigades':out=back('contract','Контракт')+heading('Бригады',contracts[ci][0])+btn('Назначить сотрудника',"assignPerson()",'primary')+table(['Сотрудник','Должность','Бригада','Назначен'],[['Зарипов Р. Г.','Мастер',esc(team),'с 12.10.2026'],['Иванов А. С.','Механик',esc(team),'с 12.10.2026']]);break;
case 'people':out=heading('Персонал')+btn('Добавить сотрудника','newPerson()','primary')+table(['Сотрудник','Должность','Доступ в ЛК','Действия'],[['Зарипов Р. Г.','Мастер','Настроен',btn('Документы',"go('docs')")+' '+btn('Назначить на объект','assignPerson()')],['Иванов А. С.','Механик','Не создан',btn('Настроить доступ',"toast('Выдача доступа требует серверной проверки прав')")],['Петрова Е. В.','Инженер по ОТ и ПБ','Настроен',btn('Сроки документов',"go('safety')")]]);break;
case 'equipment':out=equipment();break;
case 'stock':out=heading('Склады и материалы')+`<div class="actions">${btn('Переместить между складами','moveStock()','primary')}${btn('Выдать бригаде',"toast('Выдача и списание будут в рабочей версии')")}</div>`+table(['Материал','Характеристики','Склад','Остаток'],[['Муфта П2','1 м · стенка 8 мм','Склад Омск',balance+' шт'],['Муфта П2','1 м · стенка 8 мм','Склад Татарская',(12-balance)+' шт'],['Муфта П1','Увеличенный диаметр','Склад Татарская','0 шт']])+heading('История перемещений')+stockLog.map(x=>'<p>'+esc(x)+'</p>').join('');break;
case 'subs':out=heading('Субподрядчики',contracts[ci][0])+table(['Организация','Порученные работы','Доступ'],[['ООО «Монтаж»',ci===0?'Устранение дефектов':contracts[ci][1],'Только порученные работы']])+heading('Документы субподрядчика')+table(['Документ','Действие'],['Договор субподряда','Допуски сотрудников','Акты выполненных работ'].map(d=>[d,btn('Открыть',`viewDoc('${d}')`)]));break;
case 'docs':out=docs(false);break;
case 'safety':out=docs(true);break;
case 'finance':out=heading('Финансы',contracts[ci][0])+`<div class="actions">${['Договор и НДС','Добавить выполнение','Добавить затраты','Добавить выплату'].map(t=>btn(t,"toast('В прототипе показано размещение действий')",'primary')).join('')}</div><div class="panel">Расчёты будут подключены в рабочей версии. Данные разных контрактов учитываются отдельно.</div>`;break;
}$('#screen').innerHTML=out}
function contractTable(){return '<div class="panel">'+table(['Контракт','Вид работ','Места выполнения','Состояние'],contracts.map((c,i)=>[btn(esc(c[0]),`openContract(${i})`),esc(c[1]),esc(c[2]),'В работе']))+'</div>'}
function equipment(){return heading('Техника')+btn('Переместить технику','moveEquipment()','primary')+table(['Техника','Номер','Владелец','Находится','Состояние'],[['Экскаватор','А123АА','Собственная',esc(equipmentPlace),'Работает'],['Автокран','В456ВВ','Аренда','НПС Татарская','Работает'],['Сварочный агрегат','ИНВ-028','Субподрядчик','Татарск–Барабинск','Обслуживание']])}
function docs(safety){return heading(safety?'Допуски и сроки документов':'Документы Зарипова Р. Г.')+back('people','Персонал')+btn('Добавить документ',"toast('Файлы в прототип не загружаются')",'primary')+table(['Документ','Страниц','Действует до','Действия'],documents.map((d,i)=>[esc(d),i===0?3:1,i===1?'20.11.2026':'15.09.2027',btn('Открыть',`viewDoc('${esc(d)}')`)+(safety?btn('Напоминание',"toast('Напоминание включено только в прототипе')"):btn('Удалить',`deleteDoc(${i})`,'danger'))]))}
let docPage=1;function viewDoc(name){modal(esc(name),`<p>Пример многостраничного документа · Страница <b id="pageno">${docPage}</b> из 3</p><div class="panel" style="min-height:130px">Предпросмотр страницы — пример без персональных данных</div><div class="actions">${btn('←',"docPage=Math.max(1,docPage-1);$('#pageno').textContent=docPage")}${btn('→',"docPage=Math.min(3,docPage+1);$('#pageno').textContent=docPage")}</div>`,btn('← Назад к списку документов',"$('#dialog').close()"))}
function deleteDoc(i){modal('Удалить документ?',`<p>${esc(documents[i])}</p><p>В рабочей версии — удаление с возможностью восстановления.</p>`,btn('Удалить',`documents.splice(${i},1);$('#dialog').close();render()`,'danger'))}
function assignPerson(){modal('Назначить сотрудника','<label>Сотрудник<select><option>Зарипов Р. Г.</option><option>Иванов А. С.</option></select></label><label>Бригада<input id="team" value="Бригада №1"></label><label>Начало назначения<input type="date" value="2026-10-21"></label><p>Назначение не меняет права доступа в кабинет.</p>',btn('Назначить',"team=$('#team').value;$('#dialog').close();go('brigades')",'primary'))}
function newPerson(){modal('Добавить сотрудника','<label>ФИО<input></label><label>Должность<select><option>Техник</option><option>Мастер</option><option>Механик</option><option>Инженер ПТО</option><option>Инженер по ОТ и ПБ</option><option>Прораб</option><option>Водитель</option><option>Машинист</option><option>Рабочий</option><option>Другое</option></select></label><p>Создание учётной записи и доступ настраиваются отдельно.</p>',btn('Закрыть пример',"$('#dialog').close()"))}
function newContract(){modal('Добавить контракт','<label>Номер и наименование<input id="cname"></label><label>Вид работ<select id="ctype"><option>Устранение дефектов</option><option>Замена арматуры</option><option>Подготовительные работы</option><option>Смешанный контракт</option><option>Другие СМР</option></select></label><p>Документы, площадки и права настраиваются в карточке.</p>',btn('Создать пример',"addContract()",'primary'))}
function addContract(){if(!$('#cname').value.trim())return toast('Укажите название');contracts.push([$('#cname').value,$('#ctype').value,'Не назначены']);$('#dialog').close();go('contracts')}
function moveEquipment(){modal('Переместить экскаватор','<label>Новое место<select id="place"><option>НПС Татарская</option><option>Омск–Татарск</option><option>Татарск–Барабинск</option></select></label>',btn('Переместить',"equipmentPlace=$('#place').value;$('#dialog').close();render()",'primary'))}
function moveStock(){modal('Переместить муфты П2','<p>Из: Склад Омск → В: Склад Татарская</p><label>Количество<input id="qty" type="number" min="1" max="'+balance+'" value="1"></label>',btn('Переместить','saveMove()','primary'))}
function saveMove(){let q=Number($('#qty').value);if(!Number.isInteger(q)||q<1||q>balance)return toast('Недостаточный остаток или неверное количество');balance-=q;stockLog.push(q+' шт · Склад Омск → Склад Татарская');$('#dialog').close();render()}
function closeContract(){modal('Закрытие контракта','<p>Техник инициирует закрытие. Руководитель проверяет работы, документы и обязательства.</p><p>В этом примере есть незавершённые работы. Закрытие не выполняется.</p>',btn('Открыть работы',"$('#dialog').close();onlyReview=false;go('defects')"))}
render();
</script></html>
